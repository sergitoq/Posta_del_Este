.verifBox.ok::before{content:'\2713 ';font-weight:bold;}

function navKeyHandler(e){
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const idx=navFields.indexOf(e.target.id);
  if(idx===-1) return;
  e.preventDefault();
  const nextIdx=e.key==='ArrowRight'?(idx+1)%navFields.length:(idx-1+navFields.length)%navFields.length;
  const nextEl=document.getElementById(navFields[nextIdx]);
  if(nextEl) nextEl.focus();
}
function el(id){return document.getElementById(id);}
function saveState(){
  var state={
    codigo:el('codigo').value,
    mat:el('mat').value,
    may:el('may').value,
    abu:el('abu').value,
    hma:el('hma').value,
    hme:el('hme').value,
    mon:el('mon').value,
    inc:el('inc').value,
    fDesde:el('fDesde').value,
    fHasta:el('fHasta').value,
    precioSemana:el('precioSemana').value
  };
  try{localStorage.setItem('cotizadorState',JSON.stringify(state));}catch(e){}
}
function restoreState(){
  var raw;
  try{raw=localStorage.getItem('cotizadorState');}catch(e){return false;}
  if(!raw) return false;
  var s;
  try{s=JSON.parse(raw);}catch(e){return false;}
  if(s.codigo!==undefined) el('codigo').value=s.codigo;
  if(s.mat!==undefined) el('mat').value=s.mat;
  if(s.may!==undefined) el('may').value=s.may;
  if(s.abu!==undefined) el('abu').value=s.abu;
  if(s.hma!==undefined) el('hma').value=s.hma;
  if(s.hme!==undefined) el('hme').value=s.hme;
  if(s.mon!==undefined) el('mon').value=s.mon;
  if(s.inc!==undefined) el('inc').value=s.inc;
  if(s.fDesde) el('fDesde').value=s.fDesde;
  if(s.fHasta) el('fHasta').value=s.fHasta;
  if(s.precioSemana) el('precioSemana').value=s.precioSemana;
  return true;
}
function clearState(){
  try{localStorage.removeItem('cotizadorState');}catch(e){}
}
function syncHasta(){
  var d=el('fDesde').value;
  if(!d) return;
  var parts=d.split('-').map(Number);
  var ultimo=new Date(parts[0],parts[1],0);
  var mm=String(ultimo.getMonth()+1).padStart(2,'0');
  var dd=String(ultimo.getDate()).padStart(2,'0');
  el('fHasta').value=parts[0]+'-'+mm+'-'+dd;
}
function cargarPeriodos(){
  var s=el('selPeriodo');
  if(!s) return;
  while(s.options.length>1) s.remove(1);
  Object.keys(datos).forEach(function(k){
    if(datos[k].toLowerCase().includes(' no est\u00e1 disponible')) return;
    var o=document.createElement('option');o.value=k;o.textContent=k;s.appendChild(o);
  });
}
function cotizarFechas(){
  const d1=el('fDesde').value;
  const d2=el('fHasta').value;
  const ps=+el('precioSemana').value;
  const out=el('resFechas');
  const btn=el('btnCopiarFechas');
  const bewf=el('btnEnviarWppFechas');
  if(!d1||!d2){out.textContent='';btn.disabled=true;if(bewf) bewf.disabled=true;return;}
  if(!ps){out.textContent='Ingresá el precio semanal.';btn.disabled=true;if(bewf) bewf.disabled=true;return;}
  const partsD=d1.split('-').map(Number);
  const partsH=d2.split('-').map(Number);
  const fD=new Date(partsD[0],partsD[1]-1,partsD[2]);
  const fH=new Date(partsH[0],partsH[1]-1,partsH[2]);
  const dias=Math.round((fH-fD)/(1000*60*60*24));
  var cd=el('cantDias');if(cd) cd.value=dias;
  if(dias<=0){out.innerHTML='<span class="error">Fechas inválidas</span>';btn.disabled=true;if(bewf) bewf.disabled=true;return;}
  const total=Math.round((ps/7*dias)/1000)*1000;
  const sem=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const fd=sem[fD.getDay()]+' '+String(fD.getDate()).padStart(2,'0')+'/'+String(fD.getMonth()+1).padStart(2,'0');
  const fh=sem[fH.getDay()]+' '+String(fH.getDate()).padStart(2,'0')+'/'+String(fH.getMonth()+1).padStart(2,'0');
  var m=+el('mat').value||0,y=+el('may').value||0,a=+el('abu').value||0;
  var hy=+el('hma').value||0,hn=+el('hme').value||0;
  var pers=m*2+y+a+hy+hn;
  var txtPers='';
  if(m) txtPers+=m+'par+';
  if(y) txtPers+=y+'may21+';
  if(a) txtPers+=a+'abu+';
  if(hy) txtPers+=hy+'hma12+';
  if(hn) txtPers+=hn+'hme12+';
  if(txtPers) txtPers=txtPers.slice(0,-1)+' ('+pers+' pers)';
  var txtDisponible='Disponible casa Fondo (ladrillos rojos)';
  if(el('resultado').textContent.includes('Frente')) txtDisponible='Disponible casa Frente (amarilla)';
  var txtCorto=el('resultado').textContent;
  var pie='';
  var iR=txtCorto.indexOf('Reserva');
  if(iR>=0) pie=txtCorto.substring(iR).trim();
  out.textContent=
    (txtPers?txtPers+'\n\n':'')+fd+' al '+fh+'\n'+txtDisponible+'\n\n'+
    '*Precio $'+total.toLocaleString('es-AR')+'.-*'+(pie?'\n\n'+pie:'');
  btn.disabled=false;
  if(bewf) bewf.disabled=false;
}
async function generarHash(str){
  const enc=new TextEncoder().encode(str);
  const buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').substring(0,4).toUpperCase();
}
function buscar(){
  var btn=el('btnCopiar');
  var btnWpp=el('btnCopiarWpp');
  var bew=el('btnEnviarWpp');
  var bv=el('btnVerificar');if(bv) bv.disabled=true;
  var bl=el('btnCopiarLargo');if(bl) bl.disabled=true;
  btn.disabled=true;
  if(btnWpp) btnWpp.disabled=true;
  if(bew) bew.disabled=true;
  el('cotizacion').textContent='';
  var resultado=el('resultado');
  resultado.className='';
  var c=el('codigo').value;
  var cUp=c.toUpperCase();
  var suf='',base=c;
  if(cUp.endsWith('FD')||cUp.endsWith('FT')){suf=cUp.slice(-2);base=c.slice(0,-2);}
  var t=datos[base]||'';
  if(!t){var baseUp=base.toUpperCase();var found=Object.keys(datos).find(function(k){return k.toUpperCase()===baseUp;});if(found){base=found;t=datos[found]||'';}}
  if(t&&t.toLowerCase().includes(' no está disponible')){
    resultado.textContent=t;resultado.className='error';
    btn.disabled=true;if(btnWpp) btnWpp.disabled=true;if(bew) bew.disabled=true;
    if(bl) bl.disabled=true;if(bv) bv.disabled=true;
    return;
  }
  var m=+el('mat').value,y=+el('may').value,a=+el('abu').value;
  var hy=+el('hma').value,hn=+el('hme').value;
  var p=m*2+y+a+hy+hn;
  if(p===0){resultado.textContent='';return;}
  if(p>6){resultado.innerHTML='<span class="error">Capacidad máxima 6 personas</span>';return;}
  if(!t){resultado.textContent='';return;}
  t=(suf==='FT')?t.replace('casa XX','casa Frente (amarilla)').replace(/casa-xx/i,'casa-frente'):t.replace('casa XX','casa Fondo (ladrillos rojos)').replace(/casa-xx/i,'casa-fondo');
  var extra='';
  if(m) extra+=m+'par+';if(y) extra+=y+'may21+';if(a) extra+=a+'abu+';if(hy) extra+=hy+'hma12+';if(hn) extra+=hn+'hme12+';
  if(extra) extra=extra.slice(0,-1);
  if(extra) t=base+' '+extra+' ('+p+' pers)\n'+t.substring(base.length);
  t=t.replace(/\s+$/,'')+'\n\nDisponibilidad sujeta a confirmación al momento de la reserva.';
  var f=new Date();
  var dd=f.getDate().toString().padStart(2,'0');
  var mmm=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][f.getMonth()];
  var fecha='Cotización '+dd+'-'+mmm;
  var fmtF=function(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2);};
  var fVal=new Date(f.getFullYear(),f.getMonth(),f.getDate()+5);
  t+='\n'+fmtF(f)+' - válida hasta el '+fmtF(fVal);
  resultado.textContent=t;
  (async function(){
    var incBase=+el('inc').value||0;
    var incEl=el('inc');
    incEl.classList.remove('incNeg','incPos');
    if(incBase<0) incEl.classList.add('incNeg');
    else if(incBase>0) incEl.classList.add('incPos');
    var incPar=(m>1)?(m-1)*20:0;
    var incMay=0;
    if(m===0){if(y>2) incMay=(y-2)*10;}
    else{if(y>0) incMay=y*10;}
    var incTotal=incBase+incMay+incPar;
    var incAuto=incMay+incPar;
    var ia=el('incAuto');
    if(ia){
      ia.textContent=(incAuto>0?'+':'')+incAuto+'%';
      ia.classList.remove('incNeg','incPos');
      if(incAuto<0) ia.classList.add('incNeg');
      else if(incAuto>0) ia.classList.add('incPos');
    }
    var precioMatch=t.match(/\*Precio\s+\$(\d[\d\.]*)-?\*/);
    var precioBase=precioMatch?+(precioMatch[1].replace(/\./g,'')):0;
    var precioARS=Math.round((precioBase*(1+incTotal/100))/1000)*1000;
    var inpPS=el('precioSemana');
    if(inpPS){
      var fechaMatch=t.match(/(\d{2})\/(\d{2})\s+al\s+[^\s]+\s+(\d{2})\/(\d{2})\/(\d{2,4})/);
      if(fechaMatch){
        var anioFin=+fechaMatch[5]<100?2000+ +fechaMatch[5]: +fechaMatch[5];
        var fIni=new Date(anioFin, +fechaMatch[2]-1, +fechaMatch[1]);
        var fFin=new Date(anioFin, +fechaMatch[4]-1, +fechaMatch[3]);
        if(fFin<fIni) fIni.setFullYear(anioFin-1);
        var diasPer=Math.round((fFin-fIni)/(1000*60*60*24));
        if(diasPer>0) inpPS.value=Math.round((precioARS/diasPer*7)/1000)*1000;
        else inpPS.value=precioARS;
      } else { inpPS.value=precioARS; }
    }
    cotizarFechas();
    t=t.replace(/\$[\d\.]+-/,'$'+precioARS.toLocaleString('es-AR')+'.-');
    var usdMatch=t.match(/usd\s*([\d\.]+)/i);
    var precioUSD=0;
    if(usdMatch){
      var usdBase=+(usdMatch[1].replace(/\./g,''));
      precioUSD=Math.round((usdBase*(1+incTotal/100))/10)*10;
      t=t.replace(/usd\s*[\d\.\-]+/i,'usd '+precioUSD.toLocaleString('es-AR')+'.-');
    }
    resultado.textContent=t;
    resultado.textContent=resultado.textContent.replace(/(\*Precio\s+\$[\d\.]+\.\-\*)/,'$1\n');
    var txt=resultado.textContent;
    var monVal=el('mon').value;
    if(monVal==='usd'){txt=txt.replace(/\*Precio\s+\$[^\*]*\*\s*/gi,'');}
    else{txt=txt.replace(/\*Precio\s+usd[^\*]*\*\s*/gi,'');}
    resultado.textContent=txt.trim();
    if(incBase<0){
      var descPct=Math.abs(incBase);
      resultado.textContent=resultado.textContent.replace(
        /(\*Precio[^\n]+)/,
        '$1\nIncluye descuento promocional del '+descPct+'%'
      );
    }
    var fechaLimpia=fecha.replace('Cotización ','');
    var precioFirma=(monVal==='usd'&&precioUSD)?precioUSD:precioARS;
    var firmaBase=base+'|'+p+'|'+precioFirma+'|'+fechaLimpia;
    var hash=await generarHash(firmaBase);
    var firmaHTML='<div class="firma">_Cotiz.: '+hash+' '+fechaLimpia+'\t Lista: '+DB_FECHA+'_</div>';
    el('v_per').value=base;
    el('v_pers').value=p;
    el('v_precio').value=precioFirma;
    el('v_fecha').value=fechaLimpia;
    el('v_firma').value=hash;
    if(bv) bv.disabled=false;
    document.querySelectorAll('.firma').forEach(e=>e.remove());
    resultado.textContent=resultado.textContent.trim();
    resultado.insertAdjacentHTML('afterend',firmaHTML);
    btn.disabled=false;
    if(btnWpp) btnWpp.disabled=false;
    if(bew) bew.disabled=false;
    generarLargo(resultado.textContent);
    if(bl) bl.disabled=false;
    var bel=el('btnEnviarWppLargo');if(bel) bel.disabled=false;
    saveState();
  })();
}
function copiar(){
  var b=el('btnCopiar');if(b.disabled) return;
  var texto=el('resultado').textContent;
  var firma=document.querySelector('.firma');
  if(firma) texto+='\n\n'+firma.textContent;
  navigator.clipboard.writeText(texto);
  b.textContent='COPIA OK';b.classList.add('copiado');
  setTimeout(function(){b.textContent='COPIAR +ID';b.classList.remove('copiado');},1500);
}
function copiarWpp(){
  var t=el('resultado').textContent.trim();
  if(!t) return;
  navigator.clipboard.writeText(t);
  var b=el('btnCopiarWpp');if(!b) return;
  b.textContent='COPIA OK';b.classList.add('copiado');
  setTimeout(function(){b.textContent='COPIAR';b.classList.remove('copiado');},1500);
}
function enviarWpp(){
  var t=el('resultado').textContent.trim();
  if(!t) return;
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function copiarLargo(){

  b.textContent='COPIA OK';b.classList.add('copiado');
  setTimeout(function(){b.textContent='COPIAR Extendida';b.classList.remove('copiado');},1500);
}
function enviarWppLargo(){

async function verificar(){
  var base=el('v_per').value+'|'+el('v_pers').value+'|'+el('v_precio').value+'|'+el('v_fecha').value;
  var esperado=await generarHash(base);
  var vr=el('v_resultado');
  if(esperado===el('v_firma').value.toUpperCase()){
    vr.textContent='Cotización íntegra';vr.className='verifBox ok';
  }else{
    vr.textContent='Cotización alterada';vr.className='verifBox bad';
  }
}
window.addEventListener('load',function(){
  cargarPeriodos();
  var esRecarga=false;
  try{esRecarga=!!sessionStorage.getItem('tabActiva');}catch(e){}
  try{sessionStorage.setItem('tabActiva','1');}catch(e){}
  if(!esRecarga){
    limpiar();
  } else {
    var restored=restoreState();
    if(!restored) setDefaults();
    if(restored){
      if(el('codigo').value) buscar();
      if(el('fDesde').value&&el('fHasta').value) cotizarFechas();
    }
  }
  navFields.forEach(function(id){
    var e=el(id);if(e) e.addEventListener('keydown',navKeyHandler);
  });
});
